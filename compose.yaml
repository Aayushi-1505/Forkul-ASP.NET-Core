# Optional local MySQL for exercises 11 and 12. Development use only.
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: forkful
      MYSQL_USER: forkful
      MYSQL_PASSWORD: forkful_dev_only
      MYSQL_ROOT_PASSWORD: root_dev_only
    ports:
      - "3306:3306"
    volumes:
      - forkful_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u forkful -pforkful_dev_only"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  forkful_mysql:
